<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIVISION 9 // EVIDENCE ARCHIVE</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- CRT atmosphere layers -->
  <div id="scanlines" aria-hidden="true"></div>
  <div id="crt-overlay" aria-hidden="true"></div>

  <div id="app">
    <header id="topbar">
      <span id="sys-title">DIVISION 9 // EVIDENCE ARCHIVE</span>
      <span id="sys-status">SYSTEM ONLINE</span>
    </header>

    <main id="desktop">
      <section id="terminal-panel" aria-label="Archive terminal">
        <div id="terminal-output" aria-live="polite"></div>
        <div id="terminal-input-wrap">
          <span id="prompt">D9&gt;</span>
          <span id="input-box">
            <span id="mirror" aria-hidden="true"></span>
            <input id="cmdline" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input">
            <span id="cursor" aria-hidden="true">&#9608;</span>
          </span>
        </div>
      </section>
    </main>

    <div id="taskbar">
      <span id="task-label">WINDOWS:</span>
      <div id="task-items"><span id="task-empty">NONE</span></div>
    </div>

    <footer id="statusbar">
      <span id="status-open">NO FILE OPEN</span>
      <span id="status-right"></span>
    </footer>
  </div>

  <script src="js/archive.js"></script>
  <script src="js/windows.js"></script>
  <script src="js/media.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
